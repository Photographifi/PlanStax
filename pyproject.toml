[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planstax"
version = "0.3.0"
description = "Empilement et traitement par ondelettes d'images planétaires (lucky imaging)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Photographifi" }]
dependencies = [
    # Windows: kept on a widely deployed release — Smart App Control judges NumPy's unsigned
    # modules by reputation and blocked the very recent 2.5.4 (October 2026). Elsewhere, no cap:
    # NumPy 2.2 has no build for the Python 3.14 of recent Linux distributions.
    "numpy>=2.1,<2.3; sys_platform == 'win32'",
    "numpy>=2.1; sys_platform != 'win32'",
    "opencv-python-headless>=4.8",
    "PySide6-Essentials>=6.6",
    "tifffile>=2023.7",
]

[project.urls]
Homepage = "https://github.com/Photographifi/PlanStax"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
planstax-cli = "planstax.cli:main"

[project.gui-scripts]
planstax = "planstax.gui.app:main"

[tool.setuptools.packages.find]
include = ["planstax*"]

[tool.setuptools.package-data]
planstax = ["resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
